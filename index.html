<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Hide &amp; Seek</title>
<style>
body{margin:0;min-height:100vh;background:linear-gradient(#27496d,#16212e);color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:16px;text-align:center}
h1{color:#f4b942;margin:8px 0 0;text-shadow:2px 2px #000}
button,input,a.b{font-size:16px;padding:10px 14px;border-radius:10px;border:0;margin:4px}
button,a.b{background:#f4b942;color:#111;font-weight:700;text-decoration:none;display:inline-block}button:disabled{opacity:.4}
#st{margin:10px;padding:6px;border-radius:8px;background:#0006}
.pl{display:flex;justify-content:space-between;padding:8px 12px;margin:4px 0;background:#0007;border-radius:8px}
.ok{color:#6f6}.no{color:#f99}.host{color:#f4b942}
#cd{text-transform:uppercase;width:110px;text-align:center}
</style></head><body><div id="app">
<h1>SCHOOL HIDE &amp; SEEK</h1><small>Created by NH Nirob</small>
<div id="st">Not connected</div>
<div id="home">
<input id="nm" placeholder="Your name" maxlength="12"><br>
<button id="cr">Create Room</button><br>
<input id="cd" placeholder="CODE" maxlength="5"><button id="jn">Join Room</button><br>
<a class="b" href="game.html">Play With Bots (offline)</a>
</div>
<div id="lob" style="display:none">
<h2>Room <span id="rc"></span></h2><small>Share this code with friends</small>
<div id="pls"></div>
<button id="rd">Ready</button><button id="sg" disabled>Start Match</button>
<p><small>Online match gameplay arrives in the next phase.</small></p>
</div></div>
<script>
const SERVER="wss://school-hide-seek.onrender.com";
const HTTP=SERVER.replace("wss://","https://");
const $=i=>document.getElementById(i);let ws=null,me=null,rdy=false;
const st=t=>$("st").textContent=t;
$("nm").value=localStorage.getItem("shs_name")||"";
const mkCode=()=>{const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<5;i++)c+=a[Math.random()*a.length|0];return c};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function wake(){st("Waking server... can take up to a minute");
 for(let i=0;i<24;i++){try{const r=await fetch(HTTP+"/",{cache:"no-store"});if(r.ok){st("Server online");return true}}catch(e){}
  await new Promise(r=>setTimeout(r,5000))}
 st("Server unreachable");return false}
const send=(t,d)=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({t,d}))};
async function go(create){
 const name=$("nm").value.trim()||"Player";try{localStorage.setItem("shs_name",name)}catch(e){}
 const code=create?mkCode():$("cd").value.trim().toUpperCase();
 if(!code){st("Enter a room code");return}
 if(!await wake())return;
 st("Connecting...");
 try{ws=new WebSocket(SERVER)}catch(e){st("Connection failed: "+e.message);return}
 ws.onopen=()=>send(create?"create":"join",{code,name});
 ws.onerror=()=>st("Connection error");
 ws.onclose=()=>{if($("lob").style.display==="block"){st("Disconnected");$("lob").style.display="none";$("home").style.display="block"}};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t==="joined"){me=m.d.id;rdy=false;$("home").style.display="none";$("lob").style.display="block";st("Connected")}
  else if(m.t==="lobby")render(m.d);
  else if(m.t==="start")st("Match started (online gameplay comes in the next phase)");
  else if(m.t==="err"){st(m.d);try{ws.close()}catch(x){}}}}
function render(d){$("rc").textContent=d.code;
 $("pls").innerHTML=d.players.map(p=>`<div class="pl"><span>${esc(p.name)}${p.id===me?" (you)":""} ${p.id===d.host?'<b class="host">HOST</b>':""}</span><span class="${p.ready?"ok":"no"}">${p.ready?"READY":"not ready"}</span></div>`).join("");
 $("sg").disabled=!(d.host===me&&d.phase==="lobby"&&d.players.every(p=>p.ready));
 $("rd").disabled=d.phase!=="lobby";$("rd").textContent=rdy?"Unready":"Ready"}
$("cr").onclick=()=>go(true);$("jn").onclick=()=>go(false);
$("rd").onclick=()=>{rdy=!rdy;send("ready",{v:rdy})};$("sg").onclick=()=>send("start",{});
</script></body></html>
